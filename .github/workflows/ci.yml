name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core – tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check seed data is up to date
        run: uv run python scripts/generate_seed_datasets.py --check

      - name: Run tests
        run: uv run pytest -v --tb=short

  dist-smoke:
    name: Installed wheel – import and README examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Install wheel in a clean venv (outside source tree)
        run: |
          python3 -m venv /tmp/synfit-smoke-venv
          /tmp/synfit-smoke-venv/bin/pip install --upgrade pip
          /tmp/synfit-smoke-venv/bin/pip install dist/synfit-*.whl

      - name: Print installed version
        run: /tmp/synfit-smoke-venv/bin/python -c "import synfit; print(synfit.__version__)"

      - name: Run README python examples against installed package
        run: /tmp/synfit-smoke-venv/bin/python scripts/check_readme_examples.py

      - name: Run the shipped test suite from the extracted sdist
        # Downstream packagers (conda-forge, Debian, Nix, Spack) build from the
        # sdist and run these tests; an incomplete MANIFEST.in breaks them long
        # before anyone here notices.
        run: |
          mkdir -p /tmp/synfit-sdist && tar xzf dist/synfit-*.tar.gz -C /tmp/synfit-sdist --strip-components=1
          /tmp/synfit-smoke-venv/bin/pip install pytest
          cd /tmp/synfit-sdist && /tmp/synfit-smoke-venv/bin/python -m pytest -q
