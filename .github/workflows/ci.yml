name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core – tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check seed data is up to date
        run: uv run python scripts/generate_seed_datasets.py --check

      - name: Run tests
        run: uv run pytest -v --tb=short

  dist-smoke:
    name: Installed wheel – import and README examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: uv build

      - name: Install wheel in a clean venv (outside source tree)
        run: |
          python3 -m venv /tmp/synfit-smoke-venv
          /tmp/synfit-smoke-venv/bin/pip install --upgrade pip
          /tmp/synfit-smoke-venv/bin/pip install dist/synfit-*.whl

      - name: Print installed version
        run: /tmp/synfit-smoke-venv/bin/python -c "import synfit; print(synfit.__version__)"

      - name: Run README python examples against installed package
        run: /tmp/synfit-smoke-venv/bin/python scripts/check_readme_examples.py

      - name: Confirm the type marker and the scenarios are shipped
        # PEP 561: without py.typed in BOTH artifacts, mypy silently treats
        # synfit as untyped for every downstream user. Nothing else fails.
        # The scenarios are package data: a package-data glob that stops
        # matching drops them from the wheel without any import breaking.
        run: |
          python3 - <<'EOF'
          import glob, zipfile, tarfile, sys
          wheels, sdists = glob.glob("dist/*.whl"), glob.glob("dist/*.tar.gz")
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)
          wheel_names = zipfile.ZipFile(wheels[0]).namelist()
          sdist_names = tarfile.open(sdists[0]).getnames()

          ok = True
          in_wheel = "synfit/py.typed" in wheel_names
          in_sdist = any(n.endswith("src/synfit/py.typed") for n in sdist_names)
          print("py.typed - wheel:", in_wheel, "sdist:", in_sdist)
          ok &= in_wheel and in_sdist

          configs = [n for n in wheel_names if n.startswith("synfit/scenarios/") and n.endswith("config.json")]
          csvs = [n for n in wheel_names if n.startswith("synfit/scenarios/") and n.endswith(".csv")]
          print(f"scenarios in wheel - {len(configs)} configs, {len(csvs)} CSVs")
          ok &= len(configs) >= 20 and len(csvs) >= len(configs)
          sys.exit(0 if ok else 1)
          EOF

      - name: Confirm the scenarios load from the installed wheel
        # Run from /tmp: the accessors must resolve package data where it
        # actually landed, not a path relative to this checkout.
        run: |
          cd /tmp && /tmp/synfit-smoke-venv/bin/python -c "
          from synfit.synthetic import list_scenarios, scenario_config, scenario_dir
          names = list_scenarios()
          assert len(names) >= 20, names
          for name in names:
              assert scenario_config(name)['kind'] in ('single_drug', 'matrix')
              assert list(scenario_dir(name).glob('*.csv')), name
          print(f'{len(names)} scenarios readable from the installed wheel')
          "

      - name: Run the shipped test suite from the extracted sdist
        # Downstream packagers (conda-forge, Debian, Nix, Spack) build from the
        # sdist and run these tests; an incomplete MANIFEST.in breaks them long
        # before anyone here notices.
        run: |
          mkdir -p /tmp/synfit-sdist && tar xzf dist/synfit-*.tar.gz -C /tmp/synfit-sdist --strip-components=1
          /tmp/synfit-smoke-venv/bin/pip install pytest
          cd /tmp/synfit-sdist && /tmp/synfit-smoke-venv/bin/python -m pytest -q
