name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Core – tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check seed data is up to date
        run: uv run python scripts/generate_seed_datasets.py --check

      - name: Run tests
        run: uv run pytest -v --tb=short
