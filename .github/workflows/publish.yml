name: Publish

# Publishing is release-only: nothing reaches PyPI unless a GitHub release is
# *published* for a tag. Credentials are never stored — PyPI trusted publishing
# (OIDC) mints a short-lived, project-scoped token for this workflow.
#
# Manual dispatch can ONLY target TestPyPI. Production upload is unreachable by
# hand on purpose: a dispatch can run from any ref, so it would bypass the
# tag/version and ancestor-of-main guards below and could publish unmerged code
# to an index that never allows a version to be replaced.
#
# Artifact verification (wheel import, README examples, sdist suite, py.typed)
# lives in ci.yml's dist-smoke job. This workflow does not repeat it; instead it
# requires a *successful ci.yml run for the released SHA* before building, and
# then checks only what is specific to uploading: that the tag names the version
# being shipped, and that the metadata renders on the index.
#
# Actions are pinned to commit SHAs, not moving tags: `download-artifact` and
# `gh-action-pypi-publish` run inside the OIDC-enabled job, where a retargeted
# tag could swap the artifact or mint the PyPI token. Pinning means upstream
# fixes need a deliberate bump (Dependabot is configured to propose them).
#
# Setup required BEFORE the first upload (project owner, once):
#   1. PyPI → synfit → Manage → Publishing → Add a trusted publisher
#        Owner: szarma   Repository: synfit
#        Workflow: publish.yml   Environment: pypi
#      Repeat on test.pypi.org with Environment: testpypi
#   2. GitHub → Settings → Environments → create `pypi` BEFORE the publisher is
#      enabled. An environment referenced but not created is auto-created with
#      NO protection rules, which would leave the workflow itself as the only
#      control. Set: required reviewers, no admin bypass, and deployment
#      branches/tags limited to protected tags matching `v*`.
#   3. GitHub → Settings → Rules → add a ruleset protecting tag `v*` against
#      creation/update/deletion by non-maintainers, so a tag cannot be moved
#      after a release is published.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Dry run against TestPyPI (production publishing happens only via a published release)
        required: true
        default: testpypi
        type: choice
        options: [testpypi]

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          version: "0.9.26"

      # A release whose tag disagrees with pyproject.toml means the release bump
      # was missed. Publishing it would put a mislabelled artifact on an index
      # that forbids re-uploading a version.
      - name: Tag and project version must agree
        if: github.event_name == 'release'
        run: |
          proj=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$GITHUB_REF_NAME pyproject=$proj"
          test "$GITHUB_REF_NAME" = "v$proj" || { echo "::error::tag $GITHUB_REF_NAME != v$proj"; exit 1; }

      # Releases are cut from main (see AGENTS.md). A tag outside main would
      # publish code that never passed CI, including dist-smoke.
      - name: Released commit must be on main
        if: github.event_name == 'release'
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not an ancestor of origin/main"; exit 1; }

      # Being an ancestor of main does NOT establish that CI passed on this
      # commit, and the artifact verification (installed wheel, README examples,
      # sdist-installed suite, py.typed) lives in ci.yml rather than here. Require
      # a successful ci.yml run for this exact SHA, so the release genuinely
      # depends on that verification instead of merely implying it.
      - name: CI must have succeeded for the released commit
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq '.total_count')
          echo "successful ci.yml runs for $GITHUB_SHA: $n"
          test "$n" -ge 1 || { echo "::error::no successful ci.yml run for $GITHUB_SHA"; exit 1; }

      - name: Build sdist and wheel
        run: uv build

      # A README that fails to render is not fixable after upload: the version
      # is burned and the broken page stays on the project.
      - name: Check metadata renders on the index
        run: uvx 'twine==6.2.0' check --strict dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  testpypi:
    name: Upload to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/synfit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: Upload to PyPI
    needs: build
    # Release events only. See the header: a manual dispatch can run from any
    # ref and would bypass the guards in `build`.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/synfit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
